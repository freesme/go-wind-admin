server:
  rest:
    addr: ":7788"
    timeout: 10s
    enable_swagger: true
    #    - 开发/测试环境：enable_pprof: true — pprof 端点可用
    #    - 生产环境：改为 enable_pprof: false — pprof 端点不注册
    #
    #  服务运行后访问这些地址查看内存：
    #
    #  ┌───────────────────────────────────────┬────────────────┐
    #  │                 地址                  │      用途      │
    #  ├───────────────────────────────────────┼────────────────┤
    #  │ http://localhost:7788/debug/heap      │ 堆内存分析     │
    #  ├───────────────────────────────────────┼────────────────┤
    #  │ http://localhost:7788/debug/allocs    │ 内存分配统计   │
    #  ├───────────────────────────────────────┼────────────────┤
    #  │ http://localhost:7788/debug/goroutine │ Goroutine 信息 │
    #  ├───────────────────────────────────────┼────────────────┤
    #  │ http://localhost:7788/debug/pprof     │ pprof 首页     │
    #  └───────────────────────────────────────┴────────────────┘
    enable_pprof: true
    cors:
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "*"
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true

  asynq:
    uri: "redis://:*Abcd123456@localhost:6379/1"
    codec: "json"
    enable_gracefully_shutdown: true
    concurrency: 10
    shutdown_timeout: 10s
    queues:
      critical: 10
      default: 5
      low: 1
    enable_strict_priority: true

  sse:
    addr: ":7789"
    codec: "json"
    path: "/events"
    auto_stream: true
    auto_reply: false
